{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
    
    <style>
        body {
            background-color: #111827;
        }
        
        .login-container {
            width: 350px;
            margin: 80px auto;
            background-color: rgb(3, 54, 131);
            padding: 40px 30px; /* Aumenta a altura do card */
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-container h1 {
            display: flex;
            justify-content: center;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        .login-container form {
            display: flex;
            flex-direction: column;
            gap: 18px; /* Aumenta o espaço entre os campos */
        }
            .login-container input {
                padding: 12px;
                border: none;
                border-radius: 6px;
                font-size: 16px;
            }
        
            .login-container button {
                padding: 12px;
                background-color: lightskyblue;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 16px;
            }

            .login-container a {
            color: #7dd3fc; /* Link visível */
            }
    </style>
    
    <div class="login-container" > 
    <h1 style="color: black;">Login no Chatão</h1>
        <form action="">
            <label for="usuario"></label>
            <input type="text" placeholder="Usuário" id="usuario" required>
            
            <label for="senha"></label>
            <input type="password" placeholder="Senha" id="senha" required>
            <a href="#">Esqueci minha senha</a>
            
            <button type="submit">Fazer login</button>
            
        </form>
    </div>
{% endblock %}
